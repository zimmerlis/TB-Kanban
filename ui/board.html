<!DOCTYPE html>
<html data-bs-theme="auto">
    <head>
        <title data-i18n="boardTitle"></title>
        <meta charset="utf-8"/>
        <link rel="stylesheet" type="text/css" href="../vendor/bootstrap.min.css"/>
        <link rel="stylesheet" type="text/css" href="../vendor/bootstrap-icons.min.css"/>
        <link rel="stylesheet" type="text/css" href="ui.css"/>
    </head>
    <body style="font-size: 80%;">
        <div class="d-flex justify-content-end align-items-center gap-2 mb-2">
            <label class="col-form-label col-form-label-sm mb-0" data-i18n="groupByLabel" for="groupBySelect"></label>
            <select class="form-select form-select-sm w-auto" id="groupBySelect">
                <option value="none" data-i18n="noneSort"></option>
                <option value="category" data-i18n="categoriesField"></option>
                <option value="priority" data-i18n="priorityField"></option>
            </select>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="themeToggleButton" data-i18n="themeToggleLabel|title">
                <i class="bi bi-moon-stars" id="themeToggleIcon"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="settingsButton" data-i18n="settingsButtonLabel|title">
                <i class="bi bi-gear"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="aboutButton" data-i18n="aboutButtonLabel|title">
                <i class="bi bi-question-circle"></i>
            </button>
        </div>

        <div class="container-fluid h-100" id="board"></div>

        <div class="modal" id="taskEditModal" tabindex="-1">
            <div class="modal-dialog">
                <form class="modal-content" id="taskEditForm">
                    <div class="modal-header">
                        <h5 class="modal-title" data-i18n="editTaskHeader"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="titleField" for="taskEditTitle"></label>
                            <input type="text" class="form-control" id="taskEditTitle" name="title" required>
                        </div>
                        <div class="row">
                            <div class="col mb-3">
                                <label class="form-label" data-i18n="statusField" for="taskEditStatus"></label>
                                <select class="form-select" id="taskEditStatus" name="status">
                                    <option value="NEEDS-ACTION" data-i18n="needsActionStatus"></option>
                                    <option value="IN-PROCESS" data-i18n="inProcessStatus"></option>
                                    <option value="COMPLETED" data-i18n="completedStatus"></option>
                                    <option value="CANCELLED" data-i18n="cancelledStatus"></option>
                                </select>
                            </div>
                            <div class="col mb-3">
                                <label class="form-label" data-i18n="priorityField" for="taskEditPriority"></label>
                                <select class="form-select" id="taskEditPriority" name="priority">
                                    <option value="0" data-i18n="nonePriority"></option>
                                    <option value="1" data-i18n="highPriority"></option>
                                    <option value="5" data-i18n="mediumPriority"></option>
                                    <option value="9" data-i18n="lowPriority"></option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col mb-3">
                                <label class="form-label" data-i18n="startDateField" for="taskEditStart"></label>
                                <input type="date" class="form-control" id="taskEditStart" name="start">
                            </div>
                            <div class="col mb-3">
                                <label class="form-label" data-i18n="dueDateField" for="taskEditDue"></label>
                                <input type="date" class="form-control" id="taskEditDue" name="due">
                            </div>
                            <div class="col mb-3">
                                <label class="form-label" data-i18n="percentCompleteField" for="taskEditPercentComplete"></label>
                                <input type="number" class="form-control" id="taskEditPercentComplete" name="percentComplete" min="0" max="100">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="descriptionField" for="taskEditDescription"></label>
                            <textarea class="form-control" id="taskEditDescription" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="closeButton"></button>
                        <button type="submit" class="btn btn-primary" data-i18n="saveButton"></button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal" id="settingsModal" tabindex="-1">
            <div class="modal-dialog">
                <form class="modal-content" id="settingsForm">
                    <div class="modal-header">
                        <h5 class="modal-title" data-i18n="settingsHeader"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <ul class="nav nav-tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="settingsLightTab" data-bs-toggle="tab" data-bs-target="#settingsLightPane" type="button" role="tab" aria-controls="settingsLightPane" aria-selected="true" data-i18n="settingsLightSection"></button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="settingsDarkTab" data-bs-toggle="tab" data-bs-target="#settingsDarkPane" type="button" role="tab" aria-controls="settingsDarkPane" aria-selected="false" data-i18n="settingsDarkSection"></button>
                            </li>
                        </ul>
                        <div class="tab-content pt-3">
                            <div class="tab-pane fade show active" id="settingsLightPane" role="tabpanel" aria-labelledby="settingsLightTab">
                                <table class="table table-borderless align-middle mb-0">
                                    <tbody>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsLightBackground" name="lightBackground"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsBackgroundColor" for="settingsLightBackground"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsLightCardBackground" name="lightCardBackground"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsCardBackgroundColor" for="settingsLightCardBackground"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsLightTextColor" name="lightTextColor"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsCardTextColor" for="settingsLightTextColor"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsLightBorderColor" name="lightBorderColor"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsCardBorderColor" for="settingsLightBorderColor"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="number" class="form-control" id="settingsLightBorderWidth" name="lightBorderWidth" min="0" max="10"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsCardBorderWidth" for="settingsLightBorderWidth"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsLightHeaderBackground" name="lightHeaderBackground"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsHeaderColor" for="settingsLightHeaderBackground"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsLightHeaderTextColor" name="lightHeaderTextColor"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsHeaderTextColor" for="settingsLightHeaderTextColor"></label></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="tab-pane fade" id="settingsDarkPane" role="tabpanel" aria-labelledby="settingsDarkTab">
                                <table class="table table-borderless align-middle mb-0">
                                    <tbody>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsDarkBackground" name="darkBackground"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsBackgroundColor" for="settingsDarkBackground"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsDarkCardBackground" name="darkCardBackground"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsCardBackgroundColor" for="settingsDarkCardBackground"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsDarkTextColor" name="darkTextColor"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsCardTextColor" for="settingsDarkTextColor"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsDarkBorderColor" name="darkBorderColor"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsCardBorderColor" for="settingsDarkBorderColor"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="number" class="form-control" id="settingsDarkBorderWidth" name="darkBorderWidth" min="0" max="10"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsCardBorderWidth" for="settingsDarkBorderWidth"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsDarkHeaderBackground" name="darkHeaderBackground"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsHeaderColor" for="settingsDarkHeaderBackground"></label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="color" class="form-control form-control-color" id="settingsDarkHeaderTextColor" name="darkHeaderTextColor"></td>
                                            <td><label class="form-label mb-0" data-i18n="settingsHeaderTextColor" for="settingsDarkHeaderTextColor"></label></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary me-auto" id="settingsResetButton" data-i18n="resetButton"></button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="closeButton"></button>
                        <button type="submit" class="btn btn-primary" data-i18n="saveButton"></button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal" id="aboutModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" data-i18n="aboutHeader"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body text-center">
                        <img src="../images/tb-kanban.jpg" alt="TB-Kanban" class="img-fluid rounded mb-3" style="max-height: 140px;">
                        <h4 class="mb-0" id="aboutName"></h4>
                        <p class="text-muted small" id="aboutVersion"></p>
                        <p data-i18n="aboutTagline"></p>
                        <div class="d-flex justify-content-center gap-2 my-3">
                            <a href="#" id="aboutHomepageLink" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-github"></i> <span data-i18n="aboutHomepageButton"></span>
                            </a>
                            <a href="#" id="aboutDonateLink" class="btn btn-sm" style="background-color:#FFDD00; color:#000;">
                                <i class="bi bi-cup-hot-fill"></i> <span data-i18n="aboutDonateButton"></span>
                            </a>
                        </div>
                        <p class="small text-muted mb-2" data-i18n="aboutDonateHint"></p>
                        <div class="form-check text-start d-inline-block mb-2">
                            <input class="form-check-input" type="checkbox" id="aboutDonatedCheckbox">
                            <label class="form-check-label small" data-i18n="aboutDonatedCheckboxLabel" for="aboutDonatedCheckbox"></label>
                        </div>
                        <p class="small text-muted mb-0" data-i18n="aboutCredits"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="closeButton"></button>
                    </div>
                </div>
            </div>
        </div>

        <script src="../vendor/bootstrap.bundle.min.js" defer></script>
        <script src="../vendor/purify.min.js" defer></script>
        <script src="../scripts/kanban.js" type="module" defer></script>        
    </body>
</html>
